<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0070f3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="#040711" stroke="url(#cyanGrad)" stroke-width="3" />
  
  <!-- Outer glowing ring notches -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.6" />
  
  <!-- Z Letter stylized futuristic symbol -->
  <path d="M30 32 H70 L34 68 H70" stroke="url(#cyanGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Inner core dots -->
  <circle cx="50" cy="50" r="4" fill="#00f0ff" filter="url(#glow)" />
</svg>
